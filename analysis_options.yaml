include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # The core packages decode bytes from a device that can misbehave, so an
    # unawaited future is a real defect here rather than a style nit.
    unawaited_futures: error

linter:
  rules:
    - prefer_final_locals
    - prefer_final_in_for_each
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - always_declare_return_types
    - directives_ordering
    - sort_pub_dependencies
