name: foxtune_transport
description: "Flutter implementations of EcuLink: USB serial on desktop, USB OTG on Android."
version: 0.1.0
publish_to: none

# Intentionally NOT a member of the root Dart workspace: this package pulls in
# the Flutter SDK. Resolve it with `flutter pub get` from within this directory.

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # Desktop (Linux / Windows / macOS) - libserialport via FFI. Vendored and
  # patched for Gradle 9, like usb_serial: see third_party/README.md.
  flutter_libserialport:
    path: ../../third_party/flutter_libserialport
  foxtune_protocol:
    path: ../foxtune_protocol
  # Android - USB host mode / OTG. No-op on other platforms.
  usb_serial:
    path: ../../third_party/usb_serial

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  test: ^1.25.0
