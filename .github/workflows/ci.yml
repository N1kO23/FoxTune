name: CI

on:
  push:
    branches: [main]
    # A release: see "Releasing" in BUILDING.md.
    tags: ["v*"]
  pull_request:
  # "Run workflow" in the Actions tab: everything, macOS included.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request makes the run for the older one pointless.
# Pushes to main each keep their run, and with it their artifacts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned rather than tracking stable. The Android build sits in a narrow
  # window - Flutter 3.47 hard-errors below Gradle 8.14.0 / AGP 8.11.1, and
  # Gradle 9 removes the jcenter() that flutter_libserialport still calls - so a
  # Flutter bump needs to be a deliberate change with that window rechecked.
  # See BUILDING.md.
  FLUTTER_VERSION: 3.47.5
  # The Dart SDK that Flutter release ships, for the core job. The formatter's
  # output changes between SDK releases, so tracking stable would let the core
  # packages and the app disagree about what "formatted" means. Bump the two
  # together.
  DART_VERSION: 3.13.4

# Every action is pinned to a commit, with its version alongside for
# Dependabot to keep current. A tag can be moved to other code, and these run
# with this workflow's access - in build-android, the release signing key.
jobs:
  # Names the build: the version for a release tag, the commit otherwise. A tag
  # is checked first - against the app's version, and for the signing key - so
  # nothing gets built, let alone published, that could not be released.
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    outputs:
      label: ${{ steps.label.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          # All of history and its tags, to find the previous release.
          fetch-depth: 0

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./tool/check-release-version.sh "$GITHUB_REF_NAME"

      # A release signed with the debug key could never be updated by a properly
      # signed one - Android refuses a change of signature - so a release
      # without the keystore stops here rather than ship.
      - name: Require the release keystore
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEYSTORE != 'true'
        run: |
          echo "::error::A release needs the ANDROID_KEYSTORE_BASE64 secret and its passwords."
          exit 1

      - name: Label
        id: label
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            echo "label=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "label=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

  # The core packages carry no Flutter dependency, so they build and test with
  # a bare Dart SDK - no device, no display, no emulator. This job is the fast
  # signal and should stay that way.
  core:
    name: Core packages (pure Dart)
    runs-on: ubuntu-latest
    # Every job has a timeout: a hung test or build otherwise holds a runner
    # for six hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ env.DART_VERSION }}

      # Every lockfile is committed, and CI builds exactly what it pins.
      - name: Resolve workspace
        run: dart pub get --enforce-lockfile

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed packages/foxtune_ini packages/foxtune_protocol packages/foxtune_tune

      - name: Analyze
        run: dart analyze packages/foxtune_ini packages/foxtune_protocol packages/foxtune_tune

      - name: Test
        run: ./tool/test.sh

  flutter:
    name: Flutter packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Analyze and test transport
        working-directory: packages/foxtune_transport
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

      - name: Analyze and test app
        working-directory: app/foxtune_app
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test integration_test test_driver
          flutter analyze
          flutter test

  build-linux:
    name: Build Linux desktop
    # Pinned rather than ubuntu-latest. This machine's glibc decides the oldest
    # distribution the bundle and the AppImage will start on, and ubuntu-latest
    # moves to each new LTS on GitHub's schedule, not ours. The glibc check
    # below enforces the floor.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: version
    env:
      LABEL: ${{ needs.version.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      # appstream provides appstreamcli, which the AppImage packaging uses to
      # check the app's metadata.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev appstream

      - name: Build
        working-directory: app/foxtune_app
        run: |
          flutter pub get --enforce-lockfile
          flutter build linux --release

      - name: Check glibc floor
        run: ./tool/check-linux-glibc.sh app/foxtune_app/build/linux/x64/release/bundle

      # Unpacks to foxtune/, with the script that installs its desktop entry.
      - name: Package
        run: |
          tar -czf "foxtune-linux-x64-$LABEL.tar.gz" \
            --transform 's,^bundle,foxtune,' \
            --transform 's,^install-linux-desktop\.sh,foxtune/&,' \
            -C app/foxtune_app/build/linux/x64/release bundle \
            -C "$PWD/tool" install-linux-desktop.sh

      # This appimagetool builds with the static AppImage runtime, so the
      # AppImage runs without libfuse2 on the user's system. Extract-and-run
      # lets the tool itself run here without FUSE.
      #
      # The tool and the runtime it embeds are both pinned and checksummed.
      # Left to itself the tool downloads a floating "continuous" runtime, and
      # the runtime is the first code to run on every user's machine.
      - name: Install AppImage tool
        run: |
          curl -fL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl -fL -o appimage-runtime \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          printf '%s  %s\n' \
            ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0 appimagetool.AppImage \
            2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d appimage-runtime |
            sha256sum -c -
          chmod +x appimagetool.AppImage

      - name: Package AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          APPIMAGE_RUNTIME: ${{ github.workspace }}/appimage-runtime
          APPIMAGE_LABEL: ${{ env.LABEL }}
        run: |
          ./tool/package-linux-appimage.sh \
            app/foxtune_app/build/linux/x64/release/bundle \
            "$PWD/appimagetool.AppImage" \
            app/foxtune_app/build/linux/x64/release

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foxtune-linux-x64-tarball
          path: foxtune-linux-x64-*.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foxtune-linux-x64-appimage
          path: app/foxtune_app/build/linux/x64/release/foxtune-linux-x64-*.AppImage
          archive: false
          if-no-files-found: error
          retention-days: 30

  # The only place the Windows build is checked: the app draws its own title
  # bar there too, through the Win32 side of window_manager.
  build-windows:
    name: Build Windows desktop
    runs-on: windows-latest
    timeout-minutes: 30
    needs: version
    env:
      LABEL: ${{ needs.version.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Build
        working-directory: app/foxtune_app
        run: |
          flutter pub get --enforce-lockfile
          flutter build windows --release

      # Flutter does not ship the MSVC runtime, so without these three DLLs a
      # PC that has never installed the Visual C++ Redistributable cannot start
      # the app at all.
      - name: Package
        shell: pwsh
        run: |
          $release = "app/foxtune_app/build/windows/x64/runner/Release"
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "$env:SystemRoot\System32\$dll" $release
          }
          Compress-Archive -Path "$release/*" -DestinationPath "foxtune-windows-x64-$env:LABEL.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foxtune-windows-x64
          path: foxtune-windows-x64-*.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

      # From the same files as the zip, MSVC runtime included. Inno Setup comes
      # with the Windows runner image.
      - name: Build installer
        shell: pwsh
        run: |
          $version = (Select-String -Path app/foxtune_app/pubspec.yaml -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DLabel=$env:LABEL" app/foxtune_app/windows/installer/foxtune.iss

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foxtune-windows-x64-setup
          path: app/foxtune_app/build/windows/installer/foxtune-windows-x64-*-setup.exe
          archive: false
          if-no-files-found: error
          retention-days: 30

  # Release tags and manual runs only: macOS runners count ten times over
  # against a private repository's Actions minutes. Once the repository is
  # public they cost nothing, and this can run on every push like the others.
  build-macos:
    name: Build macOS app
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    needs: version
    env:
      LABEL: ${{ needs.version.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Build
        working-directory: app/foxtune_app
        run: |
          flutter pub get --enforce-lockfile
          flutter build macos --release

      # A disk image holding the app beside a link to Applications, to drag it
      # onto. The app is not signed or notarized; see "Releasing" in
      # BUILDING.md. hdiutil on hosted runners fails now and then with
      # "Resource busy", which a retry gets past.
      - name: Package
        run: |
          mkdir dmg
          ditto app/foxtune_app/build/macos/Build/Products/Release/FoxTune.app dmg/FoxTune.app
          ln -s /Applications dmg/Applications
          for attempt in 1 2 3; do
            hdiutil create -volname FoxTune -srcfolder dmg -format UDZO "foxtune-macos-$LABEL.dmg" && exit 0
            sleep 10
          done
          exit 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foxtune-macos
          path: foxtune-macos-*.dmg
          archive: false
          if-no-files-found: error
          retention-days: 30

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: version
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      LABEL: ${{ needs.version.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Decode signing keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/foxtune.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/foxtune.jks" >> "$GITHUB_ENV"

      - name: Build
        working-directory: app/foxtune_app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --release --target-platform android-arm64
          mv build/app/outputs/flutter-apk/app-release.apk "build/foxtune-android-arm64-$LABEL.apk"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foxtune-android-arm64
          path: app/foxtune_app/build/foxtune-*.apk
          archive: false
          if-no-files-found: error
          retention-days: 30

  # Only for a release tag, and only once everything above has passed. The
  # artifacts and their checksums become a draft release, to be looked over
  # and published by hand.
  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      [version, core, flutter, build-linux, build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: downloads
          merge-multiple: true

      - name: Checksums
        run: |
          mkdir release
          find downloads -type f -exec mv -t release {} +
          cd release
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: FoxTune ${{ needs.version.outputs.label }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "$TITLE" \
            --generate-notes
