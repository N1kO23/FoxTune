name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Pinned rather than tracking stable. The Android build sits in a narrow
  # window - Flutter 3.47 hard-errors below Gradle 8.14.0 / AGP 8.11.1, and
  # Gradle 9 removes the jcenter() that flutter_libserialport still calls - so a
  # Flutter bump needs to be a deliberate change with that window rechecked.
  # See BUILDING.md.
  FLUTTER_VERSION: 3.47.4

jobs:
  # The core packages carry no Flutter dependency, so they build and test with
  # a bare Dart SDK - no device, no display, no emulator. This job is the fast
  # signal and should stay that way.
  core:
    name: Core packages (pure Dart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Resolve workspace
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed packages/foxtune_ini packages/foxtune_protocol packages/foxtune_tune

      - name: Analyze
        run: dart analyze packages/foxtune_ini packages/foxtune_protocol packages/foxtune_tune

      - name: Test
        run: ./tool/test.sh

  flutter:
    name: Flutter packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Analyze transport
        working-directory: packages/foxtune_transport
        run: |
          flutter pub get
          flutter analyze

      - name: Analyze and test app
        working-directory: app/foxtune_app
        run: |
          flutter pub get
          flutter analyze
          flutter test

  build-linux:
    name: Build Linux desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Build
        working-directory: app/foxtune_app
        run: |
          flutter pub get
          flutter build linux --release

      - name: Package
        run: tar -czf "foxtune-linux-x64-${GITHUB_SHA::7}.tar.gz" -C app/foxtune_app/build/linux/x64/release bundle

      - uses: actions/upload-artifact@v7
        with:
          # Both build jobs upload, and v4+ rejects a second upload to an
          # existing artifact name - so each needs its own.
          name: foxtune-linux-x64
          path: foxtune-linux-x64-*.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 30

  # The only place the Windows build is checked: the app draws its own title
  # bar there too, through the Win32 side of window_manager.
  build-windows:
    name: Build Windows desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Build
        working-directory: app/foxtune_app
        run: |
          flutter pub get
          flutter build windows --release

      - name: Package
        shell: pwsh
        run: |
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          Compress-Archive -Path app/foxtune_app/build/windows/x64/runner/Release/* -DestinationPath "foxtune-windows-x64-$sha.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: foxtune-windows-x64
          path: foxtune-windows-x64-*.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Decode signing keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/foxtune.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/foxtune.jks" >> "$GITHUB_ENV"

      - name: Build
        working-directory: app/foxtune_app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64
          mv build/app/outputs/flutter-apk/app-release.apk "build/foxtune-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: foxtune-android-arm64
          path: app/foxtune_app/build/foxtune-*.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
