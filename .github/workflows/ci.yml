name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The core packages carry no Flutter dependency, so they build and test with
  # a bare Dart SDK - no device, no display, no emulator. This job is the fast
  # signal and should stay that way.
  core:
    name: Core packages (pure Dart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Resolve workspace
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: ./tool/test.sh

  flutter:
    name: Flutter packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Analyze transport
        working-directory: packages/foxtune_transport
        run: |
          flutter pub get
          flutter analyze
