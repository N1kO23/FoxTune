name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The core packages carry no Flutter dependency, so they build and test with
  # a bare Dart SDK - no device, no display, no emulator. This job is the fast
  # signal and should stay that way.
  core:
    name: Core packages (pure Dart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Resolve workspace
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed packages/foxtune_ini packages/foxtune_protocol packages/foxtune_tune

      - name: Analyze
        run: dart analyze packages/foxtune_ini packages/foxtune_protocol packages/foxtune_tune

      - name: Test
        run: ./tool/test.sh

  flutter:
    name: Flutter packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Analyze transport
        working-directory: packages/foxtune_transport
        run: |
          flutter pub get
          flutter analyze

      - name: Analyze and test app
        working-directory: app/foxtune_app
        run: |
          flutter pub get
          flutter analyze
          flutter test

  build-linux:
    name: Build Linux desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Build
        working-directory: app/foxtune_app
        run: |
          flutter pub get
          flutter build linux --release

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build
        working-directory: app/foxtune_app
        run: |
          flutter pub get
          flutter build apk --debug
